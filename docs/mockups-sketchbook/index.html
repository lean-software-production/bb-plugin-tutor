  var L1 = [["The coding agent", ["pi is the agent unless another is chosen", "Without an agent, nothing is built", "The plan is what the agent wrote", "The codebase holds what the agent wrote"]],
            ["Orchestration", ["The factory works in the codebase around it", "Each pass does one task, then stops"]]];

  var TICK = '<span class="sk-tick" role="img" aria-label="passed"></span>';
  function patch(src, alt) { return '<span class="sk-patch"><img src="' + src + '" alt="' + (alt || "") + '"></span>'; }

  function rule(name, st) {
    if (st === "pass") return '<li class="tp-rule"><span class="g">' + TICK + '</span><span>' + name + "</span></li>";
    if (st === "focus") return '<li class="tp-rule tp-rule--focus"><span class="g">●</span><span><span class="sk-hl">' + name + "</span></span></li>";
    if (st === "notyet") return '<li class="tp-rule tp-rule--notyet"><span class="g">!</span><span>' + name + "</span></li>";
    if (st === "pending") return '<li class="tp-rule"><span class="g">○</span><span>' + name + "</span></li>";
    return '<li class="tp-rule tp-rule--ahead" title="Your coach hasn\'t reached this Rule yet"><span class="g">○</span><span>' + name + "</span></li>";
  }
  function feature(name, rules) {
    return '<div class="tp-feat">' + name + '<span class="tp-new">new</span></div><ul class="tp-rules">' + rules.join("") + "</ul>";
  }
  function coachRow(lessonId, sel) {
    return '<div class="tp-th' + (sel ? " sel" : "") + '">' + patch("../../vendor/brand/kit/icons/chat.svg") + '<span>Coach · Lesson ' + lessonId + "</span></div>";
  }
  function sideRow(title, from, sel) {
    return '<div class="tp-th' + (sel ? " sel" : "") + '"><span class="arrow">↳</span><span>' + title + (from ? "<small>from: " + from + "</small>" : "") + "</span></div>";
  }
  var ASK = '<div class="tp-th tp-th--ask"><span class="arrow">+</span><span>Ask a side question</span></div>';
  function l0body(o) {
    return coachRow("000", o.coachSel) + feature("Your tutor", L0.map(function (n, i) { return rule(n, o.rules[i]); })) +
      (o.sides || []).join("") + ASK;
  }

  function lessonRow(i, st) {
    var l = LESSONS[i], step = STEPS[i % STEPS.length], s = st || {};
    var status = s.status || "ahead";
    var title = status === "current" ? '<span class="sk-hl">' + l[1] + "</span>" : l[1];
    if (status === "done") title += ' <span class="sk-tick" role="img" aria-label="done"></span>';
    var count = s.count === undefined ? "0/" + l[2] : s.count;
    return '<li class="tp-lesson"><div class="tp-lrow tp-lrow--' + status + '"><span class="sk-num sk-' + step + '">' + Number(l[0]) +
      '</span><span class="tp-ltitle">' + title + "</span>" + (count ? '<span class="tp-lcount">' + count + "</span>" : "") + "</div>" +
      (s.body ? '<div class="tp-lbody">' + s.body + "</div>" : "") + "</li>";
  }

  function sidebar(o) {
    var lessons = LESSONS.map(function (_, i) { return lessonRow(i, (o.lessons || {})[i] || (o.unset ? { count: "" } : null)); }).join("");
    return '<div class="bb-side-top">' + ic("panel-left") + '<span class="sp"></span>' + ic("chev-l") + ic("chev-r") + "</div>" +
      '<nav class="bb-nav">' +
      '<a>' + ic("new") + "New thread</a>" +
      '<a>' + ic("search") + "Search threads</a>" +
      '<a' + (o.courseSel ? ' class="sel"' : "") + ">" + ic("book") + "Course" + (o.acc ? '<span class="acc"><i>' + o.acc[0] + "</i> · " + o.acc[1] + "</span>" : "") + "</a>" +
      "</nav>" +
      '<div class="bb-side-scroll"><nav class="tp tp-outline" aria-label="Course outline">' +
      '<div class="tp-brand">' + patch("../../vendor/brand/kit/icons/books.svg") + 'Tutorial</div>' +
      '<ul class="tp-lessons">' + lessons + "</ul>" +
      (o.unset ? '<a class="tp-link tp-setup">Set up your factory project →</a>' : "") +
      '<div class="tp-others"><div class="hd"><span>Other threads</span><span>+</span></div><p>No other threads yet.</p></div>' +
      "</nav></div>" +
      '<div class="bb-side-foot">' + ic("cog") + ic("chart") + ic("bug") + '<span class="sp"></span><span class="bb-pill">' + ic("down") + "bb</span></div>";
  }

  var SIDES = {
    "first-run": { unset: true, courseSel: true },
    "outline": { courseSel: true, acc: ["000", "3/10"], lessons: { 0: { status: "current", count: "3/10",
      body: l0body({ rules: ["pass", "pass", "focus", "ahead", "ahead"], sides: [sideRow("Side question about a Rule", "The lesson leads your coach thread")] }) } } },
    "lesson-card": { acc: ["000", "0/10"], lessons: { 0: { status: "current", count: "0/10",
      body: l0body({ coachSel: true, rules: ["focus", "ahead", "ahead", "ahead", "ahead"] }) } } },
    "rule-cards": { acc: ["000", "2/10"], lessons: { 0: { status: "current", count: "2/10",
      body: l0body({ coachSel: true, rules: ["pass", "focus", "ahead", "ahead", "ahead"] }) } } },
    "side-chat": { acc: ["000", "6/10"], lessons: { 0: { status: "current", count: "6/10",
      body: l0body({ rules: ["pass", "pass", "pass", "focus", "ahead"], sides: [sideRow("Side question about a Rule", "A side question goes in a side chat", true)] }) } } },
    "lesson-complete": { acc: ["000", "10/10"], lessons: { 0: { status: "done", count: "10/10",
      body: l0body({ coachSel: true, rules: ["pass", "pass", "pass", "pass", "pass"], sides: [sideRow("Side question about a Rule", "A side question goes in a side chat")] }) } } },
    "home": { acc: ["001", "1/22"], lessons: { 0: { status: "done", count: "10/10" }, 1: { status: "current", count: "1/22",
      body: coachRow("001") + feature(L1[0][0], [rule(L1[0][1][0], "focus"), rule(L1[0][1][1], "ahead"), rule(L1[0][1][2], "ahead"), rule(L1[0][1][3], "ahead")]) +
            feature(L1[1][0], [rule(L1[1][1][0], "ahead"), rule(L1[1][1][1], "ahead")]) } } }
  };

  var COMPOSERS = {
    thread: { ph: "Ask for a follow-up. @ to mention files, folders, sections, or threads", under: true, mode: "Approve for me" },
    "thread-narrow": { ph: "Ask for a follow-up…", under: true, mode: "Auto", narrow: true },
    side: { ph: "Reply…", under: false },
    home: { ph: "Ask anything", home: true }
  };
  function composer(c) {
    var box = '<div class="bb-composer"><div class="ph"><span>' + c.ph + "</span>" + (c.home ? "" : ic("chev-d")) + "</div>" +
      '<div class="row">' + ic("plus") + '<span style="display:inline-flex;gap:6px;align-items:center">' + ic("zap") + "Sonnet · Medium " + ic("chev-d") + '</span><span class="sp"></span>' + ic("mic") + '<span class="bb-send">' + ic("send") + "</span></div></div>";
    var under = c.home
      ? '<div class="bb-under"><span>' + ic("folder") + "No project " + ic("chev-d") + '</span><span class="sp"></span><span>Approve for me ' + ic("chev-d") + "</span></div>"
      : c.under
        ? '<div class="bb-under">' + (c.narrow ? "" : "<span>" + ic("folder") + "capstone-project-start…</span>") + "<span>" + ic("laptop") + "Project checkout</span><span>" + ic("branch") + 'main</span><span class="sp"></span><span>' + c.mode + " " + ic("chev-d") + "</span></div>"
        : "";
    return box + under;
  }

  document.querySelectorAll("[data-side]").forEach(function (el) { el.innerHTML = sidebar(SIDES[el.dataset.side]); });
  document.querySelectorAll("[data-composer]").forEach(function (el) { el.innerHTML = composer(COMPOSERS[el.dataset.composer]); });
  document.querySelectorAll("svg[data-i]").forEach(function (el) {
    el.setAttribute("viewBox", "0 0 24 24"); el.setAttribute("aria-hidden", "true"); el.innerHTML = ICONS[el.dataset.i];
  });

  // One frame only?
  var q = new URLSearchParams(location.search), only = q.get("screen");
  if (only) {
    document.body.classList.replace("gallery", "single");
    document.querySelectorAll(".shot").forEach(function (s) { s.hidden = s.dataset.screen !== only; });
  }

  function ready() { document.documentElement.dataset.ready = "1"; }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { requestAnimationFrame(ready); });
})();
</script>
</body>
</html>
