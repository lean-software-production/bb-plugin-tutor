:root{
  /* tutorial-engine tokens (styles.css) */
  --ink:#1f2933;--muted:#63707c;--paper:#fbfaf6;--ground:#f0eee7;--line:#dedbd0;
  --blue:#2459a8;--blue-pale:#eaf1fd;--green:#1f735b;--green-pale:#e5f3ec;
  --amber:#8b5a00;--amber-pale:#fbf0d8;--red:#b43b3b;
  --shadow:0 1px 2px rgb(28 33 38/.06),0 10px 30px rgb(28 33 38/.05);
  --font-display:"Spectral",Georgia,serif;--font-core:"Archivo","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* BB host chrome (approximation — shadcn-style neutral) */
  --bb-bg:#ffffff;--bb-side:#f7f7f8;--bb-border:#e4e4e7;--bb-fg:#18181b;--bb-muted:#71717a;
  --bb-accent:#f0f0f2;--bb-primary:#18181b;
  --bb-font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:#2a2d31;font-family:var(--bb-font);color:var(--bb-fg)}
/* ---------- mockup switcher (not part of the design) ---------- */
.switcher{position:sticky;top:0;z-index:100;background:#17191c;color:#ddd;padding:10px 16px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:13px/1.3 var(--bb-font);border-bottom:1px solid #000}
.switcher b{color:#fff;margin-right:6px}
.switcher .grp{display:flex;gap:4px;align-items:center}
.switcher button{background:#2b2f35;color:#cfd3d8;border:1px solid #3a3f46;border-radius:6px;padding:5px 9px;font:inherit;cursor:pointer}
.switcher button.on{background:#2459a8;color:#fff;border-color:#2459a8}
.switcher .opts{display:flex;gap:4px;padding-left:10px;border-left:1px solid #3a3f46}
.switcher .opts:empty{display:none}
.note{max-width:1400px;margin:14px auto 0;color:#e8e6df;font:14px/1.5 var(--bb-font);padding:0 16px}
.note h2{font:600 17px var(--bb-font);margin:0 0 4px;color:#fff}
.note p{margin:0 0 6px;color:#c9c7bf}
.note code{background:#3a3d42;padding:1px 4px;border-radius:3px;font-size:12px}
.stage{padding:14px 16px 40px}
.fit{width:100%;max-width:1440px;margin:0 auto;overflow:hidden;border-radius:10px;box-shadow:0 20px 60px rgb(0 0 0/.45)}
.frame{width:1440px;height:880px;transform-origin:0 0;background:var(--bb-bg);display:grid;grid-template-columns:252px minmax(0,1fr);overflow:hidden}
.screen{display:none}.screen.on{display:block}
.opt{display:none}.opt.on{display:contents}

/* ---------- BB chrome ---------- */
.bb-side{background:var(--bb-side);border-right:1px solid var(--bb-border);display:flex;flex-direction:column;min-height:0;font-size:13px}
.bb-proj{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-weight:600}
.bb-proj .av{width:22px;height:22px;border-radius:6px;background:#18181b;color:#fff;display:grid;place-items:center;font-size:11px}
.bb-proj .chev{margin-left:auto;color:var(--bb-muted)}
.bb-new{margin:4px 10px 8px;padding:7px 10px;border:1px solid var(--bb-border);border-radius:8px;background:#fff;display:flex;gap:8px;align-items:center;font-weight:500}
.bb-new kbd{margin-left:auto;color:var(--bb-muted);font:11px var(--bb-font)}
.bb-nav{padding:4px 6px;display:grid;gap:1px}
.bb-nav a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:#3f3f46;text-decoration:none}
.bb-nav a .ic{width:16px;text-align:center;color:#52525b;font-size:13px}
.bb-nav a.on{background:#e9e9ec;color:var(--bb-fg);font-weight:600}
.bb-nav a .acc{margin-left:auto;font:600 10.5px/1 var(--bb-font);padding:3px 6px;border-radius:99px;background:#fff;border:1px solid var(--bb-border);color:#3f3f46}
.bb-nav a .acc i{font-style:normal;color:var(--blue)}
.bb-sec{padding:14px 14px 4px;color:var(--bb-muted);font-size:11px;font-weight:600;display:flex;justify-content:space-between}
.bb-threads{padding:0 6px;display:grid;align-content:start;gap:1px;overflow:auto;flex:1;min-height:0}
.bb-threads .grp{padding:8px 8px 3px;color:var(--bb-muted);font-size:11.5px;font-weight:600}
.bb-threads a{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;color:#3f3f46;text-decoration:none;white-space:nowrap;overflow:hidden}
.bb-threads a span.t{overflow:hidden;text-overflow:ellipsis}
.bb-threads a.child{padding-left:26px;color:#52525b}
.bb-threads a.on{background:#e9e9ec;color:var(--bb-fg);font-weight:500}
.bb-threads a.muted{color:#a1a1aa}
.dot{width:7px;height:7px;border-radius:50%;background:#d4d4d8;flex:none}
.dot.work{background:#22c55e;box-shadow:0 0 0 3px #22c55e22}
.dot.done{background:#a1a1aa}
.plug{font-size:10px;color:#a1a1aa;margin-left:auto}
.bb-foot{border-top:1px solid var(--bb-border);padding:10px 12px;display:flex;gap:8px;align-items:center;color:#3f3f46}
.bb-foot .me{width:22px;height:22px;border-radius:50%;background:#c7d2fe;display:grid;place-items:center;font-size:10px;font-weight:700;color:#3730a3}

/* sidebar footer disclosure (option 2B) */
.bb-disclosure{margin:6px 8px;border:1px solid var(--bb-border);border-radius:10px;background:#fbfaf6;font-family:var(--font-core);overflow:hidden}
.bb-disclosure .hd{display:flex;align-items:center;gap:6px;padding:7px 10px;font:800 9.5px/1 var(--font-core);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.bb-disclosure .hd .x{margin-left:auto;letter-spacing:0;color:#9a988f}
.bb-disclosure .bd{padding:9px 10px 10px}
.bb-disclosure .it{font:500 15px/1.15 var(--font-display);color:var(--ink);letter-spacing:-.02em}
.bb-disclosure .crumb{margin-top:6px;font-size:11px;color:#68717a;line-height:1.3}
.bb-disclosure .crumb b{color:#173f78}
.bb-disclosure .bar{height:5px;border-radius:9px;background:#e4e1d6;margin:9px 0 4px;overflow:hidden}
.bb-disclosure .bar i{display:block;height:100%;background:var(--green);border-radius:9px}
.bb-disclosure .meta{font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}
.bb-disclosure .acts{display:flex;gap:6px;margin-top:9px}
.bb-disclosure .acts a{flex:1;text-align:center;padding:5px 0;border-radius:6px;border:1px solid var(--line);background:#fff;font-size:11px;font-weight:650;color:var(--ink);text-decoration:none}
.bb-disclosure .acts a.pri{background:var(--blue);border-color:var(--blue);color:#fff}

/* BB thread / chat */
.bb-main{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
.bb-top{height:46px;border-bottom:1px solid var(--bb-border);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:13px;flex:none}
.bb-top .title{font-weight:600}
.bb-top .crumb{color:var(--bb-muted)}
.bb-top .sp{flex:1}
.bb-top .pill{border:1px solid var(--bb-border);border-radius:7px;padding:4px 8px;color:#3f3f46;font-size:12px}
.chat{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;font-size:13.5px;line-height:1.55}
.chat.compact{padding:14px 14px;gap:11px;font-size:13px}
.msg.user{align-self:flex-end;max-width:80%;background:#f1f1f3;border-radius:14px;padding:8px 12px}
.msg.asst{max-width:100%}
.msg.asst p{margin:0 0 6px}
.msg code,.bb-card code{font:12px var(--font-mono);background:#f4f4f5;padding:1px 4px;border-radius:4px}
.tool{display:flex;align-items:center;gap:8px;font-size:12px;color:#52525b;border:1px solid var(--bb-border);border-radius:8px;padding:6px 9px;background:#fafafa}
.tool .nm{font:11.5px var(--font-mono);color:#18181b}
.tool .ok{color:var(--green);font-weight:700}
.tool .sp{flex:1}
.tool .chev{color:#a1a1aa}
.composer{margin:10px 16px 14px;border:1px solid var(--bb-border);border-radius:12px;padding:10px 12px;display:flex;align-items:flex-end;gap:10px;color:#a1a1aa;font-size:13px;box-shadow:0 1px 2px rgb(0 0 0/.04);flex:none}
.composer .grow{flex:1}
.composer .row{display:flex;gap:6px;margin-top:8px;font-size:11.5px;color:#71717a}
.composer .row span{border:1px solid var(--bb-border);border-radius:6px;padding:2px 6px}
.composer .send{width:28px;height:28px;border-radius:8px;background:#18181b;color:#fff;display:grid;place-items:center;font-size:14px}
.split{display:grid;min-height:0;height:100%}
.pane-hd{height:38px;border-bottom:1px solid var(--bb-border);display:flex;align-items:center;gap:4px;padding:0 10px;font-size:12px;flex:none;background:#fff}
.pane-hd .tab{padding:5px 9px;border-radius:6px;color:#52525b}
.pane-hd .tab.on{background:var(--bb-accent);color:var(--bb-fg);font-weight:600}
.pane-hd .sp{flex:1}
.pane-hd .ic{color:#a1a1aa;padding:0 4px}

/* ---------- tutorial workbook (scoped paper look) ---------- */
.tw{font-family:var(--font-core);color:var(--ink);line-height:1.58;display:grid;grid-template-columns:250px minmax(0,1fr);min-height:0;height:100%;background:var(--ground)}
.tw.norail{grid-template-columns:minmax(0,1fr)}
.tw .rail{background:#e8e5db;border-right:1px solid var(--line);padding:24px 18px;overflow:auto;min-height:0}
.tw .brand{display:flex;gap:10px;align-items:center;margin-bottom:26px;color:#33404b;font-size:.74rem;font-weight:750;letter-spacing:.1em;text-transform:uppercase;line-height:1.2}
.tw .brand-mark{display:grid;flex:none;width:28px;height:28px;place-items:center;border-radius:8px;color:#fff;background:var(--blue);box-shadow:0 2px 0 rgb(0 0 0/.1);font-size:14px}
.tw .part-name{margin:15px 0 5px;color:#77776f;font-size:.64rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.tw .part-name:first-of-type{margin-top:0}
.tw .lesson-row{display:block;padding:6px 8px;border-radius:6px;color:#59616a;font-size:.77rem;line-height:1.25;text-decoration:none}
.tw .lesson-row .n{font-family:var(--font-mono);font-size:.68rem;color:#8d8b82;margin-right:4px}
.tw .lesson-row.done::before{margin-right:7px;color:var(--green);content:"✓"}
.tw .lesson-row.current::before{margin-right:7px;color:var(--blue);content:"●"}
.tw .lesson-row.ahead::before{margin-right:7px;color:#aaa79d;content:"○"}
.tw .lesson-row.open{color:#173f78;background:#d7e5fb;font-weight:750}
.tw .outline{display:grid;gap:1px;margin:5px 0 8px 14px;padding-left:9px;border-left:1px solid #b6cce9}
.tw .feat{display:flex;justify-content:space-between;gap:6px;padding:5px 6px 3px;font-size:.66rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#6b7179}
.tw .feat .c{font-family:var(--font-mono);letter-spacing:0;font-weight:500;color:#8d8b82}
.tw .feat.dim{color:#8f949a}
.tw .rrow{display:flex;gap:6px;padding:4px 6px;border-radius:4px;color:#68717a;font-size:.7rem;line-height:1.22;text-decoration:none}
.tw .rrow .g{flex:none;width:10px;text-align:center}
.tw .rrow.pass .g{color:var(--green)}
.tw .rrow.focus{color:#173f78;font-weight:750;background:rgb(255 255 255/.55)}
.tw .rrow.focus .g{color:var(--blue)}
.tw .rrow.todo .g{color:#aaa79d}
.tw .rrow.notyet .g{color:var(--amber)}
.tw .newdot{display:inline-block;margin-left:5px;padding:0 4px;border-radius:3px;background:var(--amber-pale);color:var(--amber);font:700 .55rem/1.5 var(--font-core);letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
.tw .railfoot{margin-top:22px;padding-top:12px;border-top:1px solid #d7d3c6;font-size:.66rem;color:#7b7a72;line-height:1.45}
.tw .railfoot code{font-family:var(--font-mono);font-size:.64rem;background:#f3f1ea;padding:0 3px;border-radius:3px}
.tw main{position:relative;min-width:0;min-height:0;overflow:auto;background-color:#fafaf3;background-image:linear-gradient(rgb(151 178 192/.18) 1px,transparent 1px),linear-gradient(90deg,rgb(151 178 192/.18) 1px,transparent 1px);background-size:25px 25px}
.tw .page{position:relative;width:min(760px,calc(100% - 96px));margin:0 auto;padding:2.4rem 0 160px}
.tw .page::before{position:absolute;top:0;bottom:0;left:-43px;width:1px;background:rgb(191 93 93/.34);content:""}
.tw .eyebrow,.tw .section-label{margin:0 0 10px;color:var(--blue);font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.tw .section-label{color:var(--muted);font-size:.68rem;margin-bottom:8px}
.tw .section-label .newdot{margin-left:6px}
.tw h1{margin:0;font-family:var(--font-display);font-size:3.6rem;font-weight:500;line-height:.98;letter-spacing:-.055em}
.tw h2{margin:0 0 14px;font-family:var(--font-display);font-size:1.9rem;font-weight:500;letter-spacing:-.035em;line-height:1.1}
.tw h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:1.35rem;letter-spacing:-.02em;line-height:1.2}
.tw .dek{margin:1.6rem 0 0;color:#4c5964;font:1.24rem/1.6 var(--font-display);max-width:690px}
.tw .prose{font:1.08rem/1.68 var(--font-display);color:#34414c;max-width:700px;margin:0 0 18px}
.tw .prose code{font:.84em var(--font-mono);background:#f3f2ed;padding:1px 4px;border-radius:3px}
.tw .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;align-items:center}
.tw .chip{padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:#56616a;background:#fff;font-size:.72rem;font-weight:650}
.tw .chip.g{color:var(--green);border-color:#bfe0d2;background:var(--green-pale)}
.tw .chip.a{color:var(--amber);border-color:#ecd7a6;background:var(--amber-pale)}
.tw .progress{margin-top:18px;max-width:520px}
.tw .progress .bar{height:8px;border-radius:9px;background:#e4e1d6;overflow:hidden;display:flex}
.tw .progress .bar i{display:block;height:100%;background:var(--green)}
.tw .progress .bar u{display:block;height:100%;background:#e3c47a}
.tw .progress .lbl{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:5px}
.tw .compass{margin:2.4rem 0 0;padding:18px 22px;background:#f1f5fc;border-left:4px solid var(--blue);border-radius:0 10px 10px 0;max-width:700px}
.tw .compass .section-label{color:var(--blue)}
.tw .compass ul{margin:0;padding-left:1.1rem;display:grid;gap:6px;font:1.02rem/1.55 var(--font-display);color:#2f3c47}
.tw .compass code{font:.82em var(--font-mono);background:#fff;padding:1px 4px;border-radius:3px}
.tw .featurehead{margin-top:5rem;padding-top:1.4rem;border-top:2px solid #1f2933}
.tw .featurehead .row{display:flex;align-items:baseline;gap:12px}
.tw .featurehead h2{margin:0}
.tw .featurehead .cnt{margin-left:auto;font:600 .78rem var(--font-mono);color:var(--muted)}
.tw .featurehead .prose{margin-top:12px;font-size:1rem;color:#56616a}
.tw .rule{margin-top:3.2rem}
.tw .rule.focus{position:relative}
.tw .rule.focus::before{content:"";position:absolute;left:-30px;top:4px;bottom:0;width:4px;border-radius:4px;background:var(--blue)}
.tw .rule.dimmed{opacity:.55}
.tw .example{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow);overflow:hidden}
.tw .example .exhd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #eeebe2;font-size:.82rem;font-weight:700}
.tw .example .exhd .st{margin-left:auto;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.st{white-space:nowrap;font-size:.66rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;align-self:start;font-family:var(--font-core)}
.st.pending{color:#6b7179;background:#f0eee7}
.st.pass{color:var(--green);background:var(--green-pale)}
.st.notyet{color:var(--amber);background:var(--amber-pale)}
.st.skip{color:#6b7179;background:#f0eee7;text-decoration:line-through}
.st.real{color:#6d3fa8;background:#f1eafb}
.tw .gherkin{margin:0;padding:12px 16px 14px;font:.8rem/1.75 var(--font-mono);color:#33404b;white-space:pre-wrap;background:#fdfcf8}
.tw .gherkin .k{color:var(--blue);font-weight:700}
.tw .gherkin .s{color:#8b4a1f}
.tw .feedback{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;font-size:.8rem;line-height:1.45;border-top:1px solid}
.tw .feedback.amber{background:var(--amber-pale);border-color:#ecd7a6;color:#5f3f06}
.tw .feedback.green{background:var(--green-pale);border-color:#bfe0d2;color:#18503f}
.tw .feedback.blue{background:var(--blue-pale);border-color:#c9daf6;color:#1b3f75}
.tw .feedback .ico{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800;color:#fff}
.tw .feedback.amber .ico{background:var(--amber)}
.tw .feedback.green .ico{background:var(--green)}
.tw .feedback.blue .ico{background:var(--blue)}
.tw .feedback code{font:.78rem var(--font-mono);background:rgb(255 255 255/.6);padding:0 4px;border-radius:3px}
.tw .feedback .who{font-weight:800;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;display:block;opacity:.8}
.tw .collapsed-rule{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed #d8d4c7;font:1.02rem/1.35 var(--font-display);color:#3d4a55}
.tw .collapsed-rule .g{color:var(--green);font-family:var(--font-core);font-weight:800}
.tw .collapsed-rule .g.todo{color:#aaa79d}
.tw .collapsed-rule .g.ny{color:var(--amber)}
.tw .collapsed-rule .x{margin-left:auto;font:600 .7rem var(--font-mono);color:#8d8b82;white-space:nowrap}
.tw .carried{margin-top:4.5rem;padding:16px 20px;border:1px dashed #cfcabb;border-radius:12px;background:rgb(255 255 255/.5)}
.tw .carried .row{display:flex;gap:10px;align-items:center;padding:6px 0;font:1rem var(--font-display)}
.tw .carried .row .x{margin-left:auto;font:600 .72rem var(--font-mono);color:var(--muted)}
.tw .continue{margin-top:22px;display:flex;align-items:center;gap:14px}
.tw .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:9px;border:1px solid #1d4c91;background:var(--blue);color:#fff;font:700 .82rem var(--font-core);text-decoration:none;box-shadow:0 1px 0 rgb(0 0 0/.08)}
.tw .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.tw .btn.big{padding:13px 20px;font-size:.95rem;border-radius:11px}
.tw .completed{margin-left:auto;color:var(--muted);font-size:.74rem}
.tw .pagebreak{margin-top:2.2rem;border:0;border-top:1px dashed #cfcabb}
.tw .bubble{margin-top:14px;max-width:88%;padding:11px 15px;border-radius:14px;font:1rem/1.6 var(--font-display)}
.tw .bubble .lab{display:block;margin-bottom:3px;font:800 .62rem var(--font-core);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.tw .bubble.coach{background:var(--green-pale);color:#1c3f34;border-top-left-radius:4px}
.tw .bubble.you{margin-left:auto;background:var(--blue-pale);color:#1b3561;border-top-right-radius:4px}
.tw .bubble code{font:.8em var(--font-mono);background:rgb(255 255 255/.65);padding:1px 4px;border-radius:3px}
.tw .toolnote{margin-top:10px;font-size:.72rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.tw .toolnote b{color:var(--green)}
.tw .dock{position:sticky;bottom:0;padding:0 0 18px;margin-top:-10px;z-index:5}
.tw .dock .inp{display:flex;align-items:flex-end;gap:10px;padding:10px 10px 10px 16px;border-radius:16px;border:1px solid var(--line);background:rgb(251 250 246/.82);backdrop-filter:blur(10px);box-shadow:var(--shadow);color:#9a988f;font:1rem var(--font-display)}
.tw .dock .inp .grow{flex:1;padding:4px 0}
.tw .dock .send{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:700 1rem var(--font-core)}
.tw .dock .hint{display:flex;justify-content:space-between;font-size:.68rem;color:var(--muted);padding:6px 6px 0}
.tw .dock .hint a{color:var(--blue);text-decoration:none;font-weight:650}
.tw .chipdown{position:absolute;right:24px;bottom:98px;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--blue);font-weight:800}
.tw .sticky-mini{position:sticky;top:0;z-index:6;margin:0 -48px;padding:9px 48px;background:rgb(250 250 243/.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;font-size:.74rem;color:var(--muted)}
.tw .sticky-mini b{color:var(--ink);font-family:var(--font-display);font-weight:500;font-size:1rem;letter-spacing:-.01em}
.tw .sticky-mini .bar{width:120px;height:5px;border-radius:9px;background:#e4e1d6;overflow:hidden;margin-left:auto}
.tw .sticky-mini .bar i{display:block;height:100%;width:73%;background:var(--green)}

/* evidence/checklist variant */
.tw .checklist{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--shadow)}
.tw .ck{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:12px 16px;border-top:1px solid #eeebe2;align-items:start}
.tw .ck:first-child{border-top:0}
.tw .ck .box{width:18px;height:18px;border-radius:5px;border:1.5px solid #c9c5b8;display:grid;place-items:center;font-size:.7rem;font-weight:800;margin-top:2px}
.tw .ck.pass .box{background:var(--green);border-color:var(--green);color:#fff}
.tw .ck.notyet .box{border-color:var(--amber);color:var(--amber)}
.tw .ck .t{font:1.02rem/1.35 var(--font-display);color:var(--ink)}
.tw .ck .sub{margin-top:5px;font-size:.74rem;color:var(--muted);line-height:1.45}
.tw .ck .sub code{font:.72rem var(--font-mono);background:#f3f2ed;padding:0 4px;border-radius:3px}
.tw .ck .ev{margin-top:8px;padding:8px 10px;border-radius:8px;background:#f6f5ef;font:.72rem/1.6 var(--font-mono);color:#3d4a55;white-space:pre}
.tw .ck .more{font-size:.7rem;color:var(--blue);font-weight:650}

/* gutter variant */
.tw .gutterwrap{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fdfcf8;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:44px minmax(0,1fr) 230px}
.tw .gutter{background:#f3f1ea;border-right:1px solid #e6e2d6;font:.8rem/1.75 var(--font-mono);color:#b0ada3;text-align:center;padding:12px 0}
.tw .gutter div{height:1.75em}
.tw .gutter .p{color:var(--green);font-weight:800}
.tw .gutter .n{color:var(--amber);font-weight:800}
.tw .gutter .o{color:#b7b4a9}
.tw .margin{border-left:1px dashed #e0dccf;padding:12px 14px;font-size:.72rem;color:#5b6570;line-height:1.5;background:#fffef9}
.tw .margin .mn{margin-bottom:14px;padding-left:8px;border-left:3px solid var(--green)}
.tw .margin .mn.a{border-color:var(--amber)}
.tw .margin .mn b{display:block;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.tw .margin code{font:.68rem var(--font-mono);background:#f3f2ed;padding:0 3px;border-radius:3px}

/* completion + next */
.tw .done-panel{position:relative;margin-top:.5rem;padding:30px 30px 26px;border-radius:16px;background:#fff;border:1px solid #bfe0d2;box-shadow:var(--shadow);overflow:hidden}
.tw .done-panel .big{display:flex;align-items:center;gap:14px}
.tw .done-panel .tick{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:1.4rem;font-weight:800}
.tw .done-panel h2{margin:0}
.tw .done-panel .stats{display:flex;gap:26px;margin-top:18px;font-size:.74rem;color:var(--muted)}
.tw .done-panel .stats b{display:block;font:500 1.6rem/1 var(--font-display);color:var(--ink);margin-bottom:3px}
.tw .done-panel .sum{margin-top:18px;padding-top:16px;border-top:1px solid #eeebe2}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:0}
.tw .done-panel>*:not(.confetti){position:relative;z-index:1}
.confetti i{position:absolute;width:7px;height:12px;border-radius:2px;opacity:.55}
.tw .diff{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden;font:.76rem/1.7 var(--font-mono)}
.tw .diff .fh{padding:7px 12px;background:#f3f1ea;border-bottom:1px solid var(--line);font-size:.72rem;color:var(--muted)}
.tw .diff div.l{padding:0 12px;white-space:pre-wrap}
.tw .diff .add{background:#e8f5ee;color:#18503f}
.tw .diff .del{background:#fbeaea;color:#8a2c2c;text-decoration:line-through;text-decoration-color:rgb(138 44 44/.4)}
.tw .diff .ctx{color:#7b858e}

/* project picker */
.tw .picker{margin-top:2rem;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);overflow:hidden;max-width:620px}
.tw .pk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:14px 18px;border-top:1px solid #eeebe2;align-items:center}
.tw .pk:first-child{border-top:0}
.tw .pk .r{width:16px;height:16px;border-radius:50%;border:1.5px solid #c9c5b8}
.tw .pk.sel{background:#f5f8fe}
.tw .pk.sel .r{border:5px solid var(--blue)}
.tw .pk .nm{font-weight:700;font-size:.9rem}
.tw .pk .pth{font:.72rem var(--font-mono);color:var(--muted)}

<script>
/* ================= data ================= */
const ITER = [
  {id:'001',t:'Basic unvalidated loop',day:'Day 1',s:'done'},
  {id:'002',t:'Checking the work',day:'Day 2',s:'done'},
  {id:'003',t:'The assembly line',day:'Day 3',s:'current'},
  {id:'004',t:'Fan out',day:'Day 3',s:'ahead'},
  {id:'005',t:'Watching',day:'Day 4',s:'ahead'},
  {id:'006',t:'Steering',day:'Day 4',s:'ahead'},
  {id:'007',t:'Skills',day:'Day 5',s:'ahead'},
];
const G = (s)=>s.replace(/"([^"]*)"/g,'<span class="s">&quot;$1&quot;</span>').replace(/^(\s*)(Rule|Example|Given|When|Then|And)\b/gm,'$1<span class="k">$2</span>');

/* ================= BB host chrome ================= */
function hostTop(active=''){
  const nav=(id,ic,l,acc='')=>`<a class="${active===id?'on':''}"><span class="ic">${ic}</span>${l}${acc}</a>`;
  return `<div class="hosttop" data-host="BB host: nav (plugin rows live here)">
    <div class="bb-proj"><span class="av">mf</span>my-factory<span class="chev">⌄</span></div>
    <div class="bb-new">✎ New thread<kbd>⌘N</kbd></div>
    <nav class="bb-nav">${nav('search','⌕','Search')}${nav('course','📓','Course','<span class="acc"><i>003</i> · 30/41</span>')}</nav></div>`;
}
const hostFoot = `<div class="hostfoot" data-host="BB host: footer"><div class="bb-foot" style="border:0"><span class="me">SL</span>Student<span style="margin-left:auto;color:#a1a1aa">⚙</span></div></div>`;

/* ================= course sidebar (experimental_threadList) ================= */
const th=(cls,ic,t,ind='')=>`<div class="th ${cls}"><span class="ic">${ic}</span><span class="t">${t}</span>${ind}</div>`;
function sidebarNested({on='coach', active='course'}={}){
  let h=`<div class="brand"><span class="brand-mark">⚙</span>Build a software factory</div>`;
  let last='';
  for(const it of ITER){
    if(it.day!==last){h+=`<div class="part-name">${it.day}</div>`;last=it.day}
    const g=it.s==='done'?'✓':it.s==='current'?'●':'○';
    h+=`<div class="lesson-row ${it.s} ${it.s==='current'?'open':''}"><span class="gl">${g}</span><span class="n">${it.id}</span>${it.t}${it.s==='done'?'<span class="cnt">1 💬</span>':''}</div>`;
    if(it.s==='current'){
      h+=`<div class="outline">
        ${th((on==='coach'?'on ':'')+'coach','✦','Coach · Homework 003','<span class="ind"></span>')}
        <div class="feat"><span>Assembly line <span class="newdot">new</span></span><span class="c">2/4</span></div>
        <div class="rrow pass"><span class="g">✓</span>Accepts a line it can run</div>
        <div class="rrow focus"><span class="g">●</span>Refuses an unknown machine</div>
        ${th((on==='debug'?'on ':'')+'nest','↳','Debug: validater crash')}
        <div class="rrow todo"><span class="g">○</span>Refuses a line that can't finish</div>
        <div class="feat"><span>Orchestration</span><span class="c">7/13 ›</span></div>

function confetti(){
  const cols=['#2459a8','#1f735b','#e3b341','#b43b3b','#7c5cc4','#2a9d8f'];let h='';
  for(let i=0;i<46;i++){const l=55+((i*37)%45),t=(i*53)%90,r=(i*47)%360;h+=`<i style="left:${l}%;top:${t}%;background:${cols[i%6]};transform:rotate(${r}deg)"></i>`}
  return `<div class="confetti">${h}</div>`;
}

function sidebarEmpty(){

/* ================= switcher ================= */
let cur='sidebar', curOpt={}; for(const k in S) curOpt[k]=Object.keys(S[k].opts)[0];
let bounds=false;
function render(){
  const sw=document.getElementById('switcher');
  let h=`<b>Tutorial plugin · round 2</b><div class="grp">`;
  for(const k in S) h+=`<button data-s="${k}" class="${k===cur?'on':''}">${S[k].label}</button>`;
  h+=`</div><div class="opts">`;
  const o=S[cur].opts; if(Object.keys(o).length>1) for(const k in o) h+=`<button data-o="${k}" class="${curOpt[cur]===k?'on':''}">${o[k].label}</button>`;
  h+=`</div><div class="tog">${cur!=='sidebar'?`sidebar: <button data-sb="nested" class="${SIDEBAR==='nested'?'on':''}">nested</button><button data-sb="tray" class="${SIDEBAR==='tray'?'on':''}">tray</button>`:''}<button data-b="1" class="${bounds?'on':''}">Show BB / plugin boundaries</button></div>`;
  sw.innerHTML=h;
  document.getElementById('note').innerHTML=S[cur].note;
  document.getElementById('frame').innerHTML=S[cur].opts[curOpt[cur]].html();
  document.body.classList.toggle('bounds',bounds);
  // start lesson scrolled to the focused rule
  document.querySelectorAll('#frame .lt .body').forEach(b=>{if(cur==='rule')return;const c=b.querySelector('.convo-div'),f=b.querySelector('.rule.focus');if(c)b.scrollTop=Math.max(0,c.offsetTop-(cur==='moments'?120:360));else if(f)b.scrollTop=Math.max(0,f.offsetTop-40)});
  fit();
}
document.getElementById('switcher').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.s)cur=b.dataset.s; if(b.dataset.o)curOpt[cur]=b.dataset.o; if(b.dataset.sb)SIDEBAR=b.dataset.sb; if(b.dataset.b)bounds=!bounds; render();
});
function fit(){const w=document.getElementById('fit').clientWidth,s=Math.min(1,w/1440),fr=document.getElementById('frame');fr.style.transform=`scale(${s})`;document.getElementById('fit').style.height=(880*s)+'px'}
addEventListener('resize',fit);
render();

</script>
