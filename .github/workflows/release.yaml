name: Release

# Push a tag v<version>, where <version> is package.json's version, to publish
# bb-plugin-tutor-<version>.tgz and its .sha256 as a GitHub Release. The tutor
# Feature downloads that tarball and pins its SHA-256. See README.md, Releasing.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BB_APP_VERSION: 0.43.4

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: The tag matches package.json's version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version; push v$version, or bump the version first"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Install the BB CLI (bb-app ${{ env.BB_APP_VERSION }})
        run: npm install --global --ignore-scripts "bb-app@${BB_APP_VERSION}"
      - name: Build the release assets from the tag
        run: scripts/release-archive.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/release"
      - name: Extract, npm ci --omit=dev --ignore-scripts, bb plugin build
        run: scripts/check-release-archive.sh "$RUNNER_TEMP/release/bb-plugin-tutor-${GITHUB_REF_NAME#v}.tgz"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/release/bb-plugin-tutor-${GITHUB_REF_NAME#v}.tgz"
          gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
